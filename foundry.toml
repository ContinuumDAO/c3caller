[profile.default]
 src = "src"
 out = "out"
 libs = ["dependencies"]
 solc = "0.8.27"
 via_ir = true
 optimizer_runs = 200
 evm_version = "cancun"
 no_match_coverage = "^(build/|script/|test/|dependencies/)"
 # Allow InitC3DApp (and other scripts) to read deployments.toml via vm.readFile
 fs_permissions = [{ access = "read", path = "./" }]

 remappings = [
     "@openzeppelin/contracts-upgradeable/=dependencies/@openzeppelin-contracts-upgradeable-5.4.0/",
     "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.4.0/",
     "forge-std/=dependencies/forge-std-1.11.0/src/"
 ]

[lint]
 lint_on_build = false

[dependencies]
 forge-std = "1.11.0"
 "@openzeppelin-contracts" = "5.4.0"
 "@openzeppelin-contracts-upgradeable" = "5.4.0"

[rpc_endpoints]
 mainnet-rpc-url = "${ETHEREUM_RPC_URL}"
 linea-rpc-url = "${LINEA_RPC_URL}"

# Explorer verification: most chains use Etherscan API (api.etherscan.io/v2/api).
# Blockscout chains (use --verifier blockscout --verifier-url <url>/api in deploy script):
#   soneium-minato-testnet, plume-testnet, rsk-testnet, ink-sepolia, bob-sepolia, lightlink-pegasus-testnet
[etherscan]
 mainnet-key = { url = "https://api.etherscan.io/v2/api?chainid=1", key = "${ETHERSCAN_API_KEY}" }
 linea-key = { url = "https://api.etherscan.io/v2/api?chainid=59144", key = "${ETHERSCAN_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
